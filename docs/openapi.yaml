openapi: 3.0.0
info:
  title: NextPlay API
  version: 0.1.0
  description: Serverless soccer team analytics API (organizations, teams,
    players, games, and per-game event data).
servers:
  - url: /
components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the Cognito user pool (see /auth/login)
  schemas:
    RoleName:
      type: string
      enum:
        - ORG_ADMIN
        - TEAM_ADMIN
        - PARENT
    Signup:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 256
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        organizationId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        requestedRole:
          $ref: "#/components/schemas/RoleName"
      required:
        - email
        - password
        - fullName
        - organizationId
        - teamId
        - requestedRole
    ConfirmSignup:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 1
          maxLength: 20
      required:
        - email
        - code
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    Logout:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
      required:
        - accessToken
    CreateOrganization:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - name
    UpdateOrganization:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    CreateTeam:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        season:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - name
    UpdateTeam:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        season:
          type: string
          minLength: 1
          maxLength: 50
    UpdateUser:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
    AssignRole:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/RoleName"
        organizationId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
      required:
        - role
    CreatePlayer:
      type: object
      properties:
        externalPlayerId:
          type: string
          minLength: 1
          maxLength: 100
        rosterLabel:
          type: string
          minLength: 1
          maxLength: 200
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        jerseyNumber:
          type: integer
          minimum: 0
      required:
        - externalPlayerId
        - rosterLabel
        - fullName
    UpdatePlayer:
      type: object
      properties:
        externalPlayerId:
          type: string
          minLength: 1
          maxLength: 100
        rosterLabel:
          type: string
          minLength: 1
          maxLength: 200
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        jerseyNumber:
          type: integer
          minimum: 0
    CreateGame:
      type: object
      properties:
        opponentName:
          type: string
          minLength: 1
          maxLength: 200
        gameDate:
          type: string
          format: date
        leagueType:
          type: string
          minLength: 1
          maxLength: 100
        externalGameId:
          type: integer
      required:
        - opponentName
    UpdateGame:
      type: object
      properties:
        opponentName:
          type: string
          minLength: 1
          maxLength: 200
        gameDate:
          type: string
          format: date
        leagueType:
          type: string
          minLength: 1
          maxLength: 100
        externalGameId:
          type: integer
    SubInterval:
      type: object
      properties:
        sequence:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        timeInMinute:
          type: integer
          minimum: 0
        timeOutMinute:
          type: integer
          minimum: 0
      required:
        - sequence
        - timeInMinute
    GoalOrAssistEvent:
      type: object
      properties:
        sequence:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        minute:
          type: integer
          minimum: 0
        position:
          type: string
          maxLength: 100
      required:
        - sequence
        - minute
    PlayerGameLogEntry:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        playerId:
          type: string
          format: uuid
        starter:
          type: boolean
        totalTimeInGameMinutes:
          type: integer
          minimum: 0
        onBenchMinutes:
          type: integer
          minimum: 0
        notes:
          type: string
        subIntervals:
          type: array
          items:
            $ref: "#/components/schemas/SubInterval"
          default: []
        goalEvents:
          type: array
          items:
            $ref: "#/components/schemas/GoalOrAssistEvent"
          default: []
        assistEvents:
          type: array
          items:
            $ref: "#/components/schemas/GoalOrAssistEvent"
          default: []
      required:
        - gameId
        - playerId
    BulkImportPlayerGameLogs:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameLogEntry"
          minItems: 1
      required:
        - entries
    AttackSource:
      type: string
      enum:
        - LEFT
        - CENTER
        - RIGHT
    DefensiveEventEntry:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        opponentNameRaw:
          type: string
          minLength: 1
          maxLength: 200
        needsReview:
          type: boolean
          default: false
        minute:
          type: integer
          minimum: 0
        goalAgainst:
          type: boolean
        goalScorerOpponent:
          type: string
          maxLength: 200
        goalkeeperId:
          type: string
          format: uuid
        leftBackId:
          type: string
          format: uuid
        cdmId:
          type: string
          format: uuid
        rightBackId:
          type: string
          format: uuid
        defensiveErrorPlayerId:
          type: string
          format: uuid
        missedHelpPlayerId:
          type: string
          format: uuid
        defensiveShape:
          type: string
          maxLength: 100
        attackSource:
          $ref: "#/components/schemas/AttackSource"
        goalTypeNotes:
          type: string
        minutesInPositionBeforeGoal:
          type: integer
          minimum: 0
      required:
        - opponentNameRaw
        - minute
        - goalAgainst
    BulkImportDefensiveEvents:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DefensiveEventEntry"
          minItems: 1
      required:
        - entries
    CornerSide:
      type: string
      enum:
        - LEFT
        - RIGHT
    CornerType:
      type: string
      enum:
        - IN
        - OUT
        - SHORT
        - PASS
    CornerKickEventEntry:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        opponentNameRaw:
          type: string
          minLength: 1
          maxLength: 200
        needsReview:
          type: boolean
          default: false
        minute:
          type: integer
          minimum: 0
        side:
          $ref: "#/components/schemas/CornerSide"
        takerId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/CornerType"
        targetZone:
          type: string
          maxLength: 100
        outcome:
          type: string
          maxLength: 200
        shot:
          type: boolean
          default: false
        goal:
          type: boolean
          default: false
        receiverId:
          type: string
          format: uuid
        notes:
          type: string
      required:
        - opponentNameRaw
        - minute
    BulkImportCornerKickEvents:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CornerKickEventEntry"
          minItems: 1
      required:
        - entries
  parameters: {}
paths:
  /auth/signup:
    post:
      summary: Create an account
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Signup"
      responses:
        "200":
          description: Success
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
  /auth/confirm:
    post:
      summary: Confirm a signup code
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSignup"
      responses:
        "200":
          description: Success
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
  /auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
