      security: []
      responses:
        "200":
          description: Success
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
  /organizations/{orgId}/teams:
    post:
      summary: Create a team
      security:
        - cognitoJwt: []
      requestBody:
        content:
          application/json:
            schema:
