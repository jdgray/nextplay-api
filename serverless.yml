service: nextplay-api

frameworkVersion: '3'

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-prune-plugin

provider:
  name: aws
  # nodejs18.x, not nodejs20.x: serverless-offline v13+ requires Serverless
  # Framework v4 (ESM-only plugin), and v12 (the last version compatible with
  # the Framework v3 used here) only emulates up through nodejs18.x. Bump this
  # once the project moves to Framework v4 / serverless-offline v14.
  runtime: nodejs18.x
  region: ${opt:region, 'us-west-2'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 15
  environment:
    NODE_ENV: ${sls:stage}
    DATABASE_URL: ${env:DATABASE_URL}
    AWS_REGION: ${self:provider.region}
    # Was `!Ref CognitoUserPool(Client)` — a reference to this stack's own
    # (never-deployed) Cognito resources below. This project actually runs
    # against a pre-existing, manually-created pool (see nextplay/README.md's
    # "Backend" section), whose id/client-id already live in .env alongside
    # DATABASE_URL above — reading them the same way fixes every /auth/*
    # handler that calls Cognito directly (signup/login/refresh/logout),
    # which previously 500'd with "clientId ... [object Object]" locally.
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_USER_POOL_CLIENT_ID: ${env:COGNITO_USER_POOL_CLIENT_ID}
  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'
        audience:
          - !Ref CognitoUserPoolClient
  # Deployed Lambdas that touch the DB must run inside the VPC that has a
  # route to the RDS Proxy/Aurora cluster (see terraform/ for that VPC and
  # the private subnets below). Pass --param:vpcId and --param:privateSubnetIds
  # (comma-separated) from `terraform output` at deploy time; left unset for
  # local-only work (serverless-offline doesn't run inside a VPC regardless).
  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds: !Split [',', "${param:privateSubnetIds, ''}"]
  # Serverless Framework's default execution role has neither of these -
  # both are needed at runtime, not just at deploy time, so missing them
  # doesn't show up until a deployed invocation fails:
  #  - EC2 ENI permissions: required for any Lambda to attach to a VPC at
  #    all (see provider.vpc above); without them every function fails to
  #    initialize once deployed, regardless of whether it touches the DB.
  #  - Cognito IDP actions: src/lib/cognito.ts calls these directly against
  #    the Cognito API from the auth handlers.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: '*'
        - Effect: Allow
          Action:
            - cognito-idp:SignUp
            - cognito-idp:ConfirmSignUp
            - cognito-idp:InitiateAuth
            - cognito-idp:GlobalSignOut
          Resource: !GetAtt CognitoUserPool.Arn

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - 'node_modules/.prisma/client/**'
    - 'node_modules/@prisma/client/**'
    - 'docs/openapi.yaml'
    - 'prisma/migrations/**'

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@prisma/client'
      - '.prisma/client'
    packagerOptions:
      scripts:
        - npx prisma generate
  serverless-offline:
    httpPort: 3000
    # serverless-offline can't verify a real Cognito-issued JWT's RS256
    # signature against Cognito's JWKS, so without this it silently drops the
    # JWT authorizer config entirely and every protected route fails at
    # startup ("only supports retrieving JWT from the headers (undefined)").
    # This decodes and checks claims (issuer/audience/expiry) but skips
    # signature verification — offline-only; real deploys go through actual
    # API Gateway JWT authorizers, which do verify the signature.
    ignoreJWTSignature: true
  prune:
    automatic: true
    number: 3

functions:
  # --- Auth (Cognito-backed; no protected authorizer except /auth/me) ---
  authSignup:
    handler: src/handlers/auth/signup.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
  authConfirm:
    handler: src/handlers/auth/confirm.handler
    events:
      - httpApi:
          path: /auth/confirm
          method: post
  authLogin:
    handler: src/handlers/auth/login.handler
    events:
      - httpApi:
          path: /auth/login
          method: post
  authRefresh:
    handler: src/handlers/auth/refresh.handler
    events:
      - httpApi:
          path: /auth/refresh
          method: post
  authLogout:
    handler: src/handlers/auth/logout.handler
    events:
      - httpApi:
          path: /auth/logout
          method: post
  authMe:
    handler: src/handlers/auth/me.handler
    events:
      - httpApi:
          path: /auth/me
          method: get
          authorizer:
            name: cognitoAuthorizer
  # --- Organizations ---
  organizationCreate:
    handler: src/handlers/organizations/create.handler
    events:
      - httpApi:
          path: /organizations
          method: post
          authorizer:
            name: cognitoAuthorizer
  organizationList:
    handler: src/handlers/organizations/list.handler
    events:
      - httpApi:
          path: /organizations
          method: get
          authorizer:
            name: cognitoAuthorizer
  organizationGet:
    handler: src/handlers/organizations/get.handler
    events:
      - httpApi:
          path: /organizations/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  organizationUpdate:
    handler: src/handlers/organizations/update.handler
    events:
      - httpApi:
          path: /organizations/{id}
          method: patch
          authorizer:
            name: cognitoAuthorizer
  organizationRemove:
    handler: src/handlers/organizations/remove.handler
    events:
      - httpApi:
          path: /organizations/{id}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  organizationListPublic:
    handler: src/handlers/organizations/list-public.handler
    events:
      - httpApi:
          path: /public/organizations
          method: get
  # --- Teams ---
  teamCreate:
    handler: src/handlers/teams/create.handler
    events:
      - httpApi:
          path: /organizations/{orgId}/teams
          method: post
          authorizer:
            name: cognitoAuthorizer
  teamList:
    handler: src/handlers/teams/list.handler
    events:
      - httpApi:
          path: /organizations/{orgId}/teams
          method: get
          authorizer:
            name: cognitoAuthorizer
  teamGet:
    handler: src/handlers/teams/get.handler
    events:
      - httpApi:
          path: /teams/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  teamUpdate:
    handler: src/handlers/teams/update.handler
    events:
      - httpApi:
          path: /teams/{id}
          method: patch
          authorizer:
            name: cognitoAuthorizer
  teamRemove:
    handler: src/handlers/teams/remove.handler
    events:
      - httpApi:
          path: /teams/{id}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  teamListPublic:
    handler: src/handlers/teams/list-public.handler
    events:
      - httpApi:
          path: /public/organizations/{orgId}/teams
          method: get
  # --- Users / Roles ---
  userGet:
    handler: src/handlers/users/get.handler
    events:
      - httpApi:
          path: /users/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  userUpdate:
    handler: src/handlers/users/update.handler
    events:
      - httpApi:
          path: /users/{id}
          method: patch
          authorizer:
            name: cognitoAuthorizer
  userListRoles:
    handler: src/handlers/users/list-roles.handler
    events:
      - httpApi:
          path: /users/{id}/roles
          method: get
          authorizer:
            name: cognitoAuthorizer
  userAssignRole:
    handler: src/handlers/users/assign-role.handler
    events:
      - httpApi:
          path: /users/{id}/roles
          method: post
          authorizer:
            name: cognitoAuthorizer
  userRemoveRole:
    handler: src/handlers/users/remove-role.handler
    events:
      - httpApi:
          path: /roles/{roleId}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  # --- Membership Requests ---
  membershipRequestList:
    handler: src/handlers/membership-requests/list.handler
    events:
      - httpApi:
          path: /organizations/{orgId}/membership-requests
          method: get
          authorizer:
            name: cognitoAuthorizer
  membershipRequestApprove:
    handler: src/handlers/membership-requests/approve.handler
    events:
      - httpApi:
          path: /membership-requests/{id}/approve
          method: post
          authorizer:
            name: cognitoAuthorizer
  membershipRequestReject:
    handler: src/handlers/membership-requests/reject.handler
    events:
      - httpApi:
          path: /membership-requests/{id}/reject
          method: post
          authorizer:
            name: cognitoAuthorizer
  # --- Players ---
  playerCreate:
    handler: src/handlers/players/create.handler
    events:
      - httpApi:
          path: /teams/{teamId}/players
          method: post
          authorizer:
            name: cognitoAuthorizer
  playerList:
    handler: src/handlers/players/list.handler
    events:
      - httpApi:
          path: /teams/{teamId}/players
          method: get
          authorizer:
            name: cognitoAuthorizer
  playerGet:
    handler: src/handlers/players/get.handler
    events:
      - httpApi:
          path: /players/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  playerUpdate:
    handler: src/handlers/players/update.handler
    events:
      - httpApi:
          path: /players/{id}
          method: patch
          authorizer:
            name: cognitoAuthorizer
  playerRemove:
    handler: src/handlers/players/remove.handler
    events:
      - httpApi:
          path: /players/{id}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  # --- Games ---
  gameCreate:
    handler: src/handlers/games/create.handler
    events:
      - httpApi:
          path: /teams/{teamId}/games
          method: post
          authorizer:
            name: cognitoAuthorizer
  gameList:
    handler: src/handlers/games/list.handler
    events:
      - httpApi:
          path: /teams/{teamId}/games
          method: get
          authorizer:
            name: cognitoAuthorizer
  gameGet:
    handler: src/handlers/games/get.handler
    events:
      - httpApi:
          path: /games/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  gameUpdate:
    handler: src/handlers/games/update.handler
    events:
      - httpApi:
          path: /games/{id}
          method: patch
          authorizer:
            name: cognitoAuthorizer
  gameRemove:
    handler: src/handlers/games/remove.handler
    events:
      - httpApi:
          path: /games/{id}
          method: delete
          authorizer:
            name: cognitoAuthorizer
  # --- Player Game Logs ---
  playerGameLogList:
    handler: src/handlers/player-game-logs/list.handler
    events:
      - httpApi:
          path: /games/{gameId}/player-game-logs
          method: get
          authorizer:
            name: cognitoAuthorizer
  playerGameLogGet:
    handler: src/handlers/player-game-logs/get.handler
    events:
      - httpApi:
          path: /player-game-logs/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  playerGameLogBulkImport:
    handler: src/handlers/player-game-logs/bulk-import.handler
    events:
      - httpApi:
          path: /player-game-logs/bulk-import
          method: post
          authorizer:
            name: cognitoAuthorizer
  # --- Defensive Events ---
  defensiveEventList:
    handler: src/handlers/defensive-events/list.handler
    events:
      - httpApi:
          path: /games/{gameId}/defensive-events
          method: get
          authorizer:
            name: cognitoAuthorizer
  defensiveEventGet:
    handler: src/handlers/defensive-events/get.handler
    events:
      - httpApi:
          path: /defensive-events/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  defensiveEventBulkImport:
    handler: src/handlers/defensive-events/bulk-import.handler
    events:
      - httpApi:
          path: /teams/{teamId}/defensive-events/bulk-import
          method: post
          authorizer:
            name: cognitoAuthorizer
  # --- Corner-Kick Events ---
  cornerKickEventList:
    handler: src/handlers/corner-kick-events/list.handler
    events:
      - httpApi:
          path: /games/{gameId}/corner-kick-events
          method: get
          authorizer:
            name: cognitoAuthorizer
  cornerKickEventGet:
    handler: src/handlers/corner-kick-events/get.handler
    events:
      - httpApi:
          path: /corner-kick-events/{id}
          method: get
          authorizer:
            name: cognitoAuthorizer
  cornerKickEventBulkImport:
    handler: src/handlers/corner-kick-events/bulk-import.handler
    events:
      - httpApi:
          path: /teams/{teamId}/corner-kick-events/bulk-import
          method: post
          authorizer:
            name: cognitoAuthorizer
  # --- Stats ---
  statsDefensiveMetrics:
    handler: src/handlers/stats/defensive-metrics.handler
    events:
      - httpApi:
          path: /teams/{teamId}/stats/defensive-metrics
          method: get
          authorizer:
            name: cognitoAuthorizer
  statsCornerKickMetrics:
    handler: src/handlers/stats/corner-kick-metrics.handler
    events:
      - httpApi:
          path: /teams/{teamId}/stats/corner-kick-metrics
          method: get
          authorizer:
            name: cognitoAuthorizer
  statsPlayerSeasonSummary:
    handler: src/handlers/stats/player-season-summary.handler
    events:
      - httpApi:
          path: /players/{id}/stats/season-summary
          method: get
          authorizer:
            name: cognitoAuthorizer
  # --- Docs (public) ---
  docsUi:
    handler: src/handlers/docs/ui.handler
    events:
      - httpApi:
          path: /docs
          method: get
  docsOpenapiYaml:
    handler: src/handlers/docs/openapi-yaml.handler
    events:
      - httpApi:
          path: /docs/openapi.yaml
          method: get

  # --- DB migration runner ---
  # No events — not reachable via API Gateway, invoke manually once deployed:
  #   npm run db:migrate:remote
  # Inherits provider.vpc like every other function here, so it can reach the
  # RDS Proxy. Longer timeout than the default since applying several
  # migrations in one invocation can take a bit.
  dbMigrate:
    handler: src/handlers/admin/migrate.handler
    timeout: 60

resources:
  Resources:
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: nextplay-${sls:stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            Required: true
            Mutable: true
          - Name: name
            Required: true
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: nextplay-${sls:stage}-client
        UserPoolId: !Ref CognitoUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false

    # --- RDS Proxy in front of the Terraform-managed Aurora cluster ---
    # The Aurora cluster, its VPC/subnets, and its security group are
    # provisioned by terraform/ (see that directory), not here — this
    # template only owns the proxy, the proxy's security group, the Lambda
    # security group, the proxy's IAM role, and the target-group association
    # that points the proxy at that cluster. Standard combo for serverless
    # Lambda workloads: Aurora scales capacity to match Lambda's bursty
    # invocation pattern, and RDS Proxy solves the actual connection-pooling
    # problem (each Lambda container opens its own DB connection; without a
    # proxy, concurrent invocations can exhaust Postgres's connection limit).
    # Auth is master username/password via Secrets Manager (`AuthScheme:
    # SECRETS`), not IAM database auth — IAM auth tokens expire every 15
    # minutes and Prisma's DATABASE_URL has no way to refresh one, so it would
    # need custom token-refresh plumbing to work at all.
    #
    # A bare AWS::RDS::DBProxy resource does NOT attach to any database by
    # itself — RdsProxyTargetGroup below is what actually wires the proxy to
    # the cluster; forgetting it is a common gap.
    #
    # No manual security-group authorization step needed here: Terraform's
    # Aurora security group already allows Postgres from anywhere in the VPC,
    # which covers the proxy since it lives in the same VPC/subnets.
    #
    # Fill in vpcId, privateSubnetIds (comma-separated), dbSecretArn, and
    # existingAuroraClusterIdentifier from `terraform output` before deploying:
    #   serverless deploy --param="vpcId=<vpc_id>" \
    #     --param="privateSubnetIds=<private_subnet_ids joined by comma>" \
    #     --param="dbSecretArn=<master_user_secret_arn>" \
    #     --param="existingAuroraClusterIdentifier=<cluster_identifier>"

    RdsProxySecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: nextplay-${sls:stage} RDS Proxy access
        VpcId: ${param:vpcId, ''}
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref LambdaSecurityGroup

    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: nextplay-${sls:stage} Lambda egress
        VpcId: ${param:vpcId, ''}

    RdsProxyRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: nextplay-${sls:stage}-rds-proxy-role
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: rds.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: nextplay-${sls:stage}-rds-proxy-secret-access
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: ${param:dbSecretArn, ''}

    RdsProxy:
      Type: AWS::RDS::DBProxy
      Properties:
        DBProxyName: nextplay-${sls:stage}-proxy
        EngineFamily: POSTGRESQL
        RoleArn: !GetAtt RdsProxyRole.Arn
        VpcSubnetIds: !Split [',', "${param:privateSubnetIds, ''}"]
        VpcSecurityGroupIds:
          - !Ref RdsProxySecurityGroup
        Auth:
          - AuthScheme: SECRETS
            SecretArn: ${param:dbSecretArn, ''}
            IAMAuth: DISABLED

    RdsProxyTargetGroup:
      Type: AWS::RDS::DBProxyTargetGroup
      Properties:
        DBProxyName: !Ref RdsProxy
        TargetGroupName: default
        DBClusterIdentifiers:
          - ${param:existingAuroraClusterIdentifier, ''}
        ConnectionPoolConfigurationInfo:
          MaxConnectionsPercent: 100
          MaxIdleConnectionsPercent: 50

  Outputs:
    CognitoUserPoolId:
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Value: !Ref CognitoUserPoolClient
